name: locale_gen
description: Generate type-safe Dart code from JSON translation files, for Flutter apps and Dart projects, with sprintf and ICU MessageFormat support.
version: 12.6.0
homepage: https://github.com/impaktfull/flutter_locale_gen
repository: https://github.com/impaktfull/flutter_locale_gen
issue_tracker: https://github.com/impaktfull/flutter_locale_gen/issues
topics:
  - localization
  - i18n
  - translations
  - codegen
  - icu
screenshots:
  - description: The example app switching between English, Dutch, Finnish, Chinese and translation keys
    path: assets/example.gif
  - description: The example app in English, showing ICU MessageFormat, sprintf and plural translations
    path: assets/example.png
environment:
  sdk: ">=3.0.0 <4.0.0"
dependencies:
  intl: ^0.20.2
  meta: ^1.16.0
  path: ^1.9.1
  yaml: ^3.1.3
dev_dependencies:
  flutter_lints: ^2.0.1
  image: ^4.10.1
  test: ^1.16.8
